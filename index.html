<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research Weekly · 学术研究周报</title><link rel="stylesheet" href="styles.css"></head><body>
<aside id="nav" aria-label="主导航"><div class="nav-top"><button id="collapse" class="icon" aria-label="收起导航" title="收起导航"></button><button class="icon" data-view="search" aria-label="搜索" title="搜索"></button></div><nav><button data-view="home" title="主页"><span data-icon="home"></span><span class="nav-label">主页</span></button><button data-view="archive" title="档案"><span data-icon="archive"></span><span class="nav-label">档案</span></button><button data-view="saved" title="收藏"><span data-icon="bookmark"></span><span class="nav-label">收藏</span></button></nav><button class="about" data-view="about" title="关于本站"><span data-icon="info"></span><span class="nav-label">关于本站</span></button></aside>
<main id="main"><div class="tools"><div class="tool-wrap"><button id="upload" class="icon" title="上传 / 导入" aria-label="上传 / 导入"></button><div id="uploadMenu" class="popover" hidden><button id="newReport">新建 / 粘贴周报</button><button id="editReport">编辑当前周报</button><button id="restore">从 JSON 备份恢复</button></div></div><button id="download" class="icon" title="下载 JSON 备份" aria-label="下载 JSON 备份"></button><div class="tool-wrap"><button id="links" class="icon" title="相关链接" aria-label="相关链接"></button><div id="linksMenu" class="popover" hidden><div class="menu-head">相关链接<button class="icon" data-close="linksMenu" aria-label="关闭相关链接">×</button></div><h4>学术检索入口</h4><a href="https://scholar.google.com/" target="_blank" rel="noopener noreferrer">Google Scholar ↗</a><a href="https://search.crossref.org/" target="_blank" rel="noopener noreferrer">Crossref ↗</a><h4>数字馆藏</h4><a href="https://www.ndl.go.jp/" target="_blank" rel="noopener noreferrer">日本国立国会图书馆 ↗</a><p class="muted">仅提供入口，本站未接入这些服务。</p></div></div></div><div id="content"></div></main>
<section id="reader" role="region" aria-label="阅读面板" hidden><div class="reader-toolbar"><button id="save" class="text-tool"></button><button id="share" class="text-tool">复制链接</button><button id="tocToggle" class="text-tool">目录</button><button id="readerClose" class="icon" aria-label="关闭阅读面板" title="关闭">×</button><div class="progress"><span id="readProgress"></span></div></div><div id="toc" class="popover" hidden></div><div id="reading" tabindex="0"><article id="article"></article></div></section>
<dialog id="editor"><form id="reportForm"><div class="dialog-head"><h2 id="editorTitle">新建周报</h2><button type="button" class="icon" id="editorClose" aria-label="关闭编辑器">×</button></div><p class="muted">仅保存在当前浏览器，不会跨设备同步。正文支持 #、##、### 标题、项目符号及 https 链接。</p><label>报告标题<input id="reportTitle" required maxlength="200"></label><label>报告日期<input id="reportDate" type="date" required></label><label>简短综述<textarea id="reportSummary" rows="2"></textarea></label><label>完整总报告<textarea id="reportBody" rows="8" required></textarea></label><h3>当周独立研究信息</h3><p class="muted">每条填写一句话动态和详情；标签以逗号分隔。日期不清楚可留空。</p><div id="entryFields"></div><button id="addEntry" type="button" class="secondary">＋ 添加一条信息</button><div class="actions"><button type="button" id="editorCancel" class="secondary">取消</button><button class="primary" type="submit">保存周报</button></div><p id="editError" role="alert"></p></form></dialog><input id="importFile" type="file" accept=".json,application/json" hidden><div id="status" role="status" aria-live="polite"></div><script src="sample.js"></script><script src="app.js"></script></body></html>
